<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/>
<!--
  Talking head com legenda clássica (2 a 3 palavras, sem animação de palavra).
  1. node scripts/preparar-fala.mjs <gravacao.mp4> <projeto>/assets/fala.mp4
  2. node scripts/transcrever.mjs <projeto>/assets/fala.mp4 <projeto>/palavras.json   (revise os nomes!)
  3. node scripts/legenda.mjs <projeto>/palavras.json > <projeto>/assets/legenda.js
  4. Ajuste o data-duration do #root e do vídeo para a duração do fala.mp4.
  5. (opcional) Pop-ups parados com imagem real: node scripts/popups.mjs <projeto>/popups.json > <projeto>/assets/popups.js
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="assets/legenda.js"></script>
<script src="assets/popups.js"></script>
<style>
@font-face{font-family:"Manrope";src:url("assets/Manrope-variable.ttf");font-weight:200 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Manrope",Arial,sans-serif;color:#fff}
.abs{position:absolute}
#fala{left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.leg{left:90px;right:90px;bottom:330px;text-align:center;font-size:72px;font-weight:800;line-height:1.12;
  text-shadow:0 0 8px rgba(0,0,0,.9),0 6px 18px rgba(0,0,0,.8);opacity:0;z-index:50}
/* Pop-up parado: imagem real (mockup, foto oficial, print) acima da cabeça; aparece e some num quadro. */
.pop{left:50%;top:110px;transform:translateX(-50%);max-width:820px;background:#fff;border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);opacity:0;z-index:40;text-align:center}
.pop.esquerda{left:60px;top:640px;transform:none;max-width:460px}
.pop.direita{left:auto;right:60px;top:640px;transform:none;max-width:460px}
.pop.esquerda img,.pop.direita img{max-width:432px;max-height:420px}
.pop img{display:block;max-width:792px;max-height:460px;margin:0 auto;border-radius:12px}
.pop div{font-size:40px;font-weight:800;color:#141414;padding:10px 6px 2px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
<video id="fala" class="clip abs" src="assets/fala.mp4" data-start="0" data-duration="12" data-media-start="0" data-track-index="0" data-has-audio="true" playsinline></video>
</div>
<script>
const tl=gsap.timeline({paused:true});
const root=document.getElementById("root");
(window.LEGENDA||[]).forEach((g,i)=>{
  const el=document.createElement("div");
  el.className="abs leg";el.id="leg"+i;el.textContent=g.texto;
  root.appendChild(el);
  tl.set(el,{opacity:1},g.inicio);
  tl.set(el,{opacity:0},g.fim);
});
(window.POPUPS||[]).forEach((p,i)=>{
  const el=document.createElement("div");
  el.className="abs pop "+(p.pos||"topo");el.id="pop"+i;
  const img=document.createElement("img");img.src=p.imagem;el.appendChild(img);
  if(p.texto){const t=document.createElement("div");t.textContent=p.texto;el.appendChild(t);}
  root.appendChild(el);
  tl.set(el,{opacity:1},p.inicio);
  tl.set(el,{opacity:0},p.fim);
});
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
